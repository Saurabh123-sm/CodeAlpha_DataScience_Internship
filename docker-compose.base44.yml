services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    command:
      [
        "sh", "-ec",
        "pip install --no-cache-dir -r requirements.txt && exec python app.py",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
